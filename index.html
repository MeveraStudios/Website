<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mevera Studios | Documentation</title>
  <meta name="description" content="Documentation for Mevera Studios open-source libraries: Imperat, Lotus, Scofi, and Synapse." />
  <meta name="author" content="Mevera Studios" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="light dark" />

  <!-- Canonical (per-page <link rel="canonical"> is injected at runtime) -->
  <link rel="canonical" href="https://docs.mevera.studio/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mevera Studios Docs" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Mevera Studios | Documentation" />
  <meta property="og:description" content="Documentation for Mevera Studios open-source libraries: Imperat, Lotus, Scofi, and Synapse." />
  <meta property="og:url" content="https://docs.mevera.studio/" />
  <meta property="og:image" content="https://docs.mevera.studio/icon-1024.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mevera Studios | Documentation" />
  <meta name="twitter:description" content="Documentation for Mevera Studios open-source libraries: Imperat, Lotus, Scofi, and Synapse." />
  <meta name="twitter:image" content="https://docs.mevera.studio/icon-1024.png" />

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mevera Docs" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- JSON-LD: Organization + WebSite (with SearchAction) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://docs.mevera.studio/#organization",
        "name": "Mevera Studios",
        "url": "https://docs.mevera.studio/",
        "logo": "https://docs.mevera.studio/icon-512.png",
        "sameAs": [
          "https://github.com/MeveraStudios",
          "https://discord.mevera.studio"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://docs.mevera.studio/#website",
        "url": "https://docs.mevera.studio/",
        "name": "Mevera Studios Documentation",
        "publisher": { "@id": "https://docs.mevera.studio/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://docs.mevera.studio/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <script>
    // GitHub Pages SPA redirect restore
    // 404.html redirects to /?p=<encoded-path>
    // This script restores the real URL before React loads.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      if (p) {
        var h = params.get('h') || '';
        window.history.replaceState(null, null, p + h);
      }
    })();
  </script>

  <style>
    .skip-link {
      position: fixed;
      top: -100px;
      left: 1rem;
      z-index: 9999;
      padding: 0.5rem 1rem;
      background: #00f0ff;
      color: #050505;
      border-radius: 0.375rem;
      font-weight: 600;
      text-decoration: none;
      transition: top 0.15s ease-in-out;
    }

    .skip-link:focus,
    .skip-link:focus-visible {
      top: 1rem;
      outline: 2px solid #00f0ff;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
